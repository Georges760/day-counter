[package]
name = "day-counter"
version = "0.1.0"
edition = "2024"
description = "Count the days you spent in each country over a year, from your flights and border crossings, in a terminal dashboard"
authors = ["Georges Palauqui"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["travel", "timezone", "residency", "tui", "cli"]
categories = ["command-line-utilities", "date-and-time"]

[dependencies]
anyhow = "1.0"
blit = { git = "https://github.com/nicoburniske/blit", rev = "b90e8f76463baef6123d3ee2c20beeffee9d47de" }
blit-tui = { git = "https://github.com/nicoburniske/blit", rev = "b90e8f76463baef6123d3ee2c20beeffee9d47de" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
