[package]
name = "day-counter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
blit = { git = "https://github.com/nicoburniske/blit", rev = "b26b8e2c701edb1413a036f3d5ab0e25139e067c" }
blit-tui = { git = "https://github.com/nicoburniske/blit", rev = "b26b8e2c701edb1413a036f3d5ab0e25139e067c" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
